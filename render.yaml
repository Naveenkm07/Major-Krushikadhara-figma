services:
  - type: web
    name: krushikadhara-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - fromGroup: backend
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
      - key: PYTHON_EXECUTABLE
        value: /opt/venv/bin/python
